[project]
name = "illusionframe"
version = "0.1.0"
description = "A picture that mutates itself: segmentation + generative AI in a feedback loop, toward projection mapping."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Juan Garassino" }]
dependencies = [
    "numpy>=1.26,<2",
    "opencv-python==4.10.0.84",  # newest wheel for macOS 12 x86_64; highgui needed for the live window
    "pillow>=10",                # GIF writing
]

[project.optional-dependencies]
diffusion = [
    "torch==2.2.2",
    "diffusers>=0.35.2,<0.36",   # 0.36+ calls torch.xpu (torch>=2.4); 0.39+ needs torch>=2.6
    "transformers>=4.49,<5",     # CLIP text encoder; v5 needs torch>=2.5
    "huggingface-hub>=0.30,<1",  # transformers<5 needs hub<1
    "safetensors>=0.4",
    "accelerate>=1.0,<2",
]
dev = ["pytest>=7.2", "ruff>=0.6"]

[project.scripts]
illusionframe = "illusionframe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/illusionframe"]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra"]
markers = ["slow: downloads models or runs diffusion"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
